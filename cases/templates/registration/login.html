<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login – Youth Justice CMS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#1a365d 0%,#2d5a8e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-wrap{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:400px;overflow:hidden}
.login-header{background:#1a365d;padding:2rem;text-align:center}
.login-header .icon{font-size:2.5rem}
.login-header h1{color:#fbd38d;font-size:1.3rem;margin-top:.5rem;font-weight:700}
.login-header p{color:#90cdf4;font-size:.8rem;margin-top:.25rem}
.login-body{padding:2rem}
label{display:block;font-weight:600;font-size:.85rem;color:#4a5568;margin-bottom:.35rem}
input{width:100%;padding:.65rem .85rem;border:1px solid #cbd5e0;border-radius:6px;font-size:.9rem;color:#2d3748;margin-bottom:1.25rem;transition:border-color .15s}
input:focus{outline:none;border-color:#3182ce;box-shadow:0 0 0 3px rgba(49,130,206,.1)}
.btn-login{width:100%;padding:.75rem;background:#2b6cb0;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.25rem}
.btn-login:hover{background:#2c5282}
.error{background:#fed7d7;border:1px solid #fc8181;color:#742a2a;padding:.65rem .85rem;border-radius:6px;font-size:.85rem;margin-bottom:1rem}
.login-footer{text-align:center;padding:1rem;background:#f7fafc;color:#a0aec0;font-size:.75rem;border-top:1px solid #e2e8f0}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <div class="icon">⚖</div>
    <h1>Youth Justice CMS</h1>
    <p>Case Management System — Staff Login</p>
  </div>
  <div class="login-body">
    {% if form.errors %}
    <div class="error">Invalid username or password. Please try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>
  <div class="login-footer">Northern Territory Youth Justice Department &nbsp;·&nbsp; Confidential System</div>
</div>
</body>
</html>
